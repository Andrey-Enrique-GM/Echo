<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Pantalla de roleplay -->
    <div id="pantalla-roleplay" class="contenedor">
        <div style="text-align: left; margin-bottom: 10px;">
            <a href="/" style="color: #3182ce; text-decoration: none; font-size: 14px;">← Cambiar de personaje</a>
        </div>

        <div class="escenario">
            <div class="zona-personaje">
                <!-- Inyectamos dinámicamente el data-personaje y la imagen inicial -->
                <img id="avatar-personaje" 
                     data-personaje="{{ id_personaje }}" 
                     src="/static/images/characters/{{ id_personaje }}/{{ id_personaje }}-{{ emocion_inicial }}.png" 
                     alt="Avatar Personaje">
            </div>
            
            <div class="zona-dialogo">
                <!-- Inyectamos el saludo inicial que ya generó Groq -->
                <div id="globo-texto" class="globo">{{ saludo_inicial }}</div>
            </div>
        </div>

        <!-- Barra de input para enviar mensajes -->
        <div class="barra-input">
            <input type="text" id="input-mensaje" placeholder="Escribe tu respuesta aquí..." onkeydown="if(event.key === 'Enter') enviarMensaje()">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
