<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Selección de Personaje</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Fondo de burbujasss -->
    <div id="burbujas-container"></div>

    <!-- Pantalla de selección de personaje -->
    <div id="menu-seleccion" class="contenedor-seleccion">
        <header class="bienvenida">
            <h1>Bienvenido a Echo</h1>
            <p>Una aplicación web de roleplay chat con Inteligencia Artificial</p>
            <p>Elige un personaje para comenzar la historia:</p>
        </header>

        <div class="tarjetas-personajes">
            {% for id_personaje, info in personajes.items() %}
                <button class="tarjeta-btn" onclick="seleccionarPersonaje('{{ id_personaje }}')">
                    <div class="tarjeta-imagen">
                        <img src="/static/images/characters/{{ id_personaje }}/{{ id_personaje }}-neutral.png" alt="Sprite {{ info.nombre }}">
                    </div>
                    <div class="tarjeta-nombre">
                        {{ info.nombre }}
                    </div>
                </button>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
