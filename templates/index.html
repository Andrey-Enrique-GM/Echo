<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/site/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Fondo de burbujasss -->
    <div id="burbujas-container"></div>

    <!-- Pantalla de bienvenida / landing page -->
    <main class="hero-landing">
        <div class="contenedor-logo-landing">
            <img src="{{ url_for('static', filename='images/site/echo.png') }}" alt="Logo de Echo" class="logo-animado">
        </div>
        
        <h1 class="titulo-landing">ECHO</h1>
        <p class="subtitulo-landing">Una aplicación web de chat roleplay con Inteligencia Artificial</p>
        
        <a href="{{ url_for('menu') }}" class="btn-comenzar-landing">
            <span>Comenzar</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </main>

    <!-- Botón Flotante de mi GitHub -->
    <a href="https://github.com/Andrey-Enrique-GM/Echo" target="_blank" class="link-github-flotante" title="Ver repositorio en GitHub">
        <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span>GitHub</span>
    </a>

    <!-- Botón Flotante de Información ( ? ) -->
    <button id="btn-info-proyecto" class="btn-ayuda-flotante" title="Información del Proyecto" onclick="abrirModalInfo()">?</button>

    <!-- Modal de Información y Créditos -->
    {% include 'modal_info.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
