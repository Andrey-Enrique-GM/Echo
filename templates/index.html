<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Selección de Personaje</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Pantalla de selección de personaje -->
    <div id="menu-seleccion" class="contenedor">
        <h1>Elige el personaje con el que quieres hablar</h1>
        <div class="botones-personajes">
            {% for id_personaje, info in personajes.items() %}
                <button onclick="seleccionarPersonaje('{{ id_personaje }}')">
                    {{ info.nombre }}
                </button>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
